name: Security (scheduled)

# `npm audit` runs on every pull request in ci.yml. This workflow holds the
# slower scans — the ones worth a weekly run rather than a per-push one.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned and checksum-verified. `latest` fetched an unverified binary and
      # ran it as root in the one job whose whole purpose is supply-chain
      # assurance — the weakest link in the pipeline was the scanner itself.
      # Dependabot does not track this, so bump OSV_VERSION by hand.
      - name: Install OSV-Scanner
        env:
          OSV_VERSION: v2.5.0
        run: |
          base="https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}"
          curl -fsSL -o /tmp/osv-scanner "${base}/osv-scanner_linux_amd64"
          curl -fsSL -o /tmp/osv-scanner_SHA256SUMS "${base}/osv-scanner_SHA256SUMS"
          # The published sums cover every platform build; check only ours.
          grep ' osv-scanner_linux_amd64$' /tmp/osv-scanner_SHA256SUMS \
            | sed 's#osv-scanner_linux_amd64#/tmp/osv-scanner#' \
            | sha256sum --check --strict
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
      - run: osv-scanner --lockfile=package-lock.json

  semgrep:
    name: Semgrep (OWASP Top 10)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - run: |
          semgrep \
            --config=p/javascript \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --metrics=off

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every dependency here is a devDependency, so `--omit=dev` — the house
      # default for a published package — would audit an empty tree.
      - run: npm run security:audit

  license-check:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run license:check
