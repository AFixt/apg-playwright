name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Deliberately unpinned. apg-react is the system under test, not a build
      # input: this suite exists to notice when its default branch stops
      # following the APG, so it tracks that branch rather than a fixed ref.
      # The cost is real — an upstream commit can turn this run red with no
      # change here — and that is the intended signal, not a flake to pin away.
      - name: Check out apg-react (serves the demo pages under test)
        uses: actions/checkout@v6
        with:
          repository: AFixt/apg-react
          path: .apg-react

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install suite dependencies
        run: npm ci

      # `npm ci` can prune an unresolvable dependency and still exit 0, so
      # assert the tree actually resolved rather than trusting the exit code.
      - name: Verify dependency tree resolved
        run: npm ls --depth=0

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build and start the demo server
        working-directory: .apg-react
        run: |
          npm ci
          npm run demos:build
          # `--host ::` is load-bearing: vite preview otherwise binds localhost
          # to [::1] alone, and Firefox resolves localhost to 127.0.0.1, so
          # every navigation fails with NS_ERROR_NET_RESET. Chromium tolerates
          # the IPv6-only bind, which is why this only surfaced once the run
          # covered all three engines.
          npx vite preview --config vite.demos.config.mjs --host :: &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/demos/accordion.html; then
              echo "demo server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "demo server did not come up on :8080" >&2
          exit 1

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: markdownlint
        run: npm run markdownlint

      - name: Copy/paste detection
        run: npm run dupes

      - name: npm audit
        run: npm run security:audit

      # All three engines, not just the Chromium default. The harness carries
      # engine-specific code — the Option+Tab chord WebKit needs, the sentinels
      # Firefox needs — and Chromium exercises none of it, so a Chromium-only
      # gate would let those paths rot unnoticed. The browsers are already
      # installed above, so the extra cost is the run time.
      - name: Playwright tests (Chromium, Firefox, WebKit)
        run: npm run test:engines

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
