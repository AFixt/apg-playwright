name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check out apg-react (serves the demo pages under test)
        uses: actions/checkout@v6
        with:
          repository: AFixt/apg-react
          path: .apg-react

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install suite dependencies
        run: npm ci

      # `npm ci` can prune an unresolvable dependency and still exit 0, so
      # assert the tree actually resolved rather than trusting the exit code.
      - name: Verify dependency tree resolved
        run: npm ls --depth=0

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build and start the demo server
        working-directory: .apg-react
        run: |
          npm ci
          npm run demos:build
          npx vite preview --config vite.demos.config.mjs &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/demos/accordion.html; then
              echo "demo server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "demo server did not come up on :8080" >&2
          exit 1

      - name: Lint
        run: npm run lint

      - name: markdownlint
        run: npm run markdownlint

      - name: Playwright tests
        run: npm test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
